name = "arkeia-api"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# CORS: existing GitHub Pages origin and new custom domain (scheme+host only).
ALLOWED_ORIGINS = "https://www.kasai-solutions-inc.com,https://uni-tadayasu.github.io"
# Stripe payment link mapping unchanged.
STRIPE_LINKS = '{"plink_XXXXXXXX":"crimson"}'

# Keep deployed Worker secrets intact: SIGN_PRIVATE_JWK, PEPPER,
# OP_KEY_SHA256, CHIEF_KEY_SHA256, STRIPE_WEBHOOK_SECRET.
# Do not regenerate or paste secret material into this config file.

[[durable_objects.bindings]]
name = "INVITE_LOCK"
class_name = "InviteLock"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[durable_objects.bindings]]
name = "SYNC_LOCK"
class_name = "SyncLock"

[[durable_objects.bindings]]
name = "PID_BIND"
class_name = "PidBind"

[[durable_objects.bindings]]
name = "GUILD"
class_name = "GuildLock"

[[durable_objects.bindings]]
name = "GUILD_BOARD"
class_name = "GuildBoard"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[durable_objects.bindings]]
name = "MAIL_STORE"
class_name = "MailStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InviteLock", "Limiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SyncLock"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PidBind", "GuildLock", "GuildBoard", "Store"]

[[migrations]]
tag = "v4-mail"
new_sqlite_classes = ["MailStore"]
