name: Riftfall Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riftfall-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate game
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and asset references
        run: npm run check
      - name: Test game systems
        run: npm test
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Test the game in Chromium
        run: npm run test:browser
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classic-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/classic-smoke
          if-no-files-found: warn
          retention-days: 14

  merge:
    name: Merge validated Riftfall branch
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'codex/riftfall-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      commit: ${{ steps.merge.outputs.commit }}
    steps:
      # This job deliberately does not check out or run pull request code.
      - name: Merge only the tested revision
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const event = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: event.number
            });
            const expectedRepository = `${owner}/${repo}`;
            if (pr.merged) {
              core.info('This pull request was already merged.');
              core.setOutput('merged', 'false');
              return;
            }
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.base.repo.full_name !== expectedRepository ||
                pr.head.repo?.full_name !== expectedRepository ||
                !pr.head.ref.startsWith('codex/riftfall-')) {
              throw new Error('This pull request is outside the automatic merge scope.');
            }
            if (pr.head.sha !== event.head.sha) {
              throw new Error('The branch changed after validation. Its latest run must pass.');
            }
            const { data: main } = await github.rest.git.getRef({
              owner, repo, ref: 'heads/main'
            });
            if (main.object.sha !== event.base.sha) {
              throw new Error('main changed after this run started. Update the branch from main and rerun validation.');
            }
            const { data: result } = await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number,
              sha: event.head.sha, merge_method: 'squash',
              commit_title: `${pr.title} (#${pr.number})`
            });
            if (!result.merged) {
              throw new Error(result.message || 'GitHub did not merge the pull request.');
            }
            core.setOutput('merged', 'true');
            core.setOutput('commit', result.sha);
            await core.summary
              .addHeading('Validated Riftfall changes merged')
              .addRaw(`Pull request #${pr.number} → main\n\nCommit: ${result.sha}`)
              .write();

  pages:
    name: Publish and verify Pages
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      # GITHUB_TOKEN merges do not trigger branch-based Pages builds by themselves.
      - name: Publish the merged commit and wait for completion
        uses: actions/github-script@v7
        env:
          EXPECTED_COMMIT: ${{ needs.merge.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const expectedCommit = process.env.EXPECTED_COMMIT;
            if (!/^[a-f0-9]{40}$/i.test(expectedCommit || '')) {
              throw new Error('The merge job did not provide a valid commit to publish.');
            }
            const { data: pages } = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
            if (pages.build_type === 'workflow') {
              throw new Error('Pages now uses a custom workflow. Configure that deployment workflow for the automated merge before relying on automatic publication.');
            }
            if (pages.source?.branch !== 'main') {
              throw new Error('Pages does not publish main. Check the Pages source setting.');
            }
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.object.sha !== expectedCommit) {
              throw new Error('main changed after the automatic merge. Publication of this exact commit cannot be requested.');
            }
            const { data: previousBuilds } = await github.request('GET /repos/{owner}/{repo}/pages/builds', {
              owner, repo, per_page: 10
            });
            const previousBuildUrls = new Set(previousBuilds.map(candidate => candidate.url));
            const { data: build } = await github.request('POST /repos/{owner}/{repo}/pages/builds', { owner, repo });
            // Some responses use /latest, which is not a stable build identity.
            const requestedBuildId = build.url?.match(/\/pages\/builds\/(\d+)$/)?.[1];
            core.info(`Pages build requested: ${build.status || 'queued'}`);

            // A successful request only means queued. Wait for a build of the
            // merged SHA; previous builds must not pass or fail a retry.
            for (let attempt = 0; attempt < 60; attempt++) {
              let published;
              if (requestedBuildId) {
                ({ data: published } = await github.request('GET /repos/{owner}/{repo}/pages/builds/{build_id}', {
                  owner, repo, build_id: requestedBuildId
                }));
                if (published.commit && published.commit !== expectedCommit) {
                  throw new Error('The requested Pages build targets a different commit. Check whether main changed during publication.');
                }
              } else {
                const { data: builds } = await github.request('GET /repos/{owner}/{repo}/pages/builds', {
                  owner, repo, per_page: 10
                });
                published = builds.find(candidate => candidate.commit === expectedCommit && !previousBuildUrls.has(candidate.url));
              }
              if (published?.commit === expectedCommit && published.status === 'built') {
                core.info(`Pages published commit ${expectedCommit}.`);
                await core.summary
                  .addHeading('GitHub Pages publication verified')
                  .addRaw(`Published commit: ${expectedCommit}\n\n${pages.html_url || ''}`)
                  .write();
                return;
              }
              if (published && ['errored', 'error', 'failed', 'cancelled'].includes(published.status)) {
                throw new Error(`Pages did not publish ${expectedCommit}: ${published.error?.message || published.status}`);
              }
              core.info(`Waiting for Pages (${attempt + 1}/60): ${published?.status || 'queued'}`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error(`Timed out waiting for Pages to publish ${expectedCommit}. Inspect the Pages build and rerun the failed job.`);
